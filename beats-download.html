<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loumana - Free Beats</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body class="beats-page-body">
    <div class="beats-page-container">
        <header class="beats-header">
            <a href="index.html" class="beats-back-link">← Back</a>
            <h1 class="beats-page-title">Free club bangers</h1>
            <p class="beats-page-subtitle">Hi i made these free songs for someone dance on it. Click to download.</p>
        </header>

        <main class="beats-main">
            <div class="beats-track-list">
                <!-- Track Item -->
                <div class="beats-track-item" data-track="1">
                    <button class="beats-play-btn" aria-label="Play">
                        <svg class="beats-play-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="beats-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                        </svg>
                    </button>
                    <div class="beats-track-info">
                        <span class="beats-track-number">01</span>
                        <span class="beats-track-name">Money Trees</span>
                        <span class="beats-track-duration">--:--</span>
                    </div>
                    <button class="beats-download-btn">Download</button>
                    <audio class="beats-audio" preload="metadata">
                        <source src="assets/audio/Money trees Z.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>
        </main>
    </div>

    <!-- Download Modal -->
    <div id="beats-download-modal" class="beats-modal">
        <div class="beats-modal-content">
            <button class="beats-modal-close">&times;</button>
            <h2 class="beats-modal-title">Get the Beat</h2>
            <p class="beats-modal-text">Support the artist or download for free.</p>
            <form id="beats-download-form" class="beats-modal-form">
                <div class="beats-form-group">
                    <label for="beats-email">Email Address</label>
                    <input type="email" id="beats-email" required placeholder="your@email.com">
                </div>
                <div class="beats-modal-actions">
                    <a href="#" class="beats-donate-link">Donate & Download</a>
                    <button type="submit" class="beats-submit-btn">Free Download</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
