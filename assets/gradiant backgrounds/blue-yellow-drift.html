<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue-Yellow Organic Drift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100vh;
            background: #fff;
        }

        /* 
           EXTRACTED COLORS:
           Blue Anchor: #1792cf
           Yellow Anchor: #e8c94a
           Mid tones: #47b1d4 (Cyan), #ded16b (Lime-Gold)
        */

        .scroll-container {
            width: 200vw;
            height: 100vh;
            position: relative;
            display: flex;
        }

        /* 
           THE GIANT CANVAS 
           This element spans the entire 200vw width. 
           We paint the gradients on THIS single surface.
           No "seams" between blocks because there are no blocks in the background.
        */
        .atmospheric-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #5fc0e4;
            /* Base mid-tone */
            overflow: hidden;
        }

        /* 
           ORGANIC BLOBS (Radial Gradients)
           We position these absolutely within the 200vw canvas.
           Using 'vmax' ensures they are huge and soft.
        */

        /* 1. Deep Blue Cloud (Top Left - Start) */
        .blob-1 {
            position: absolute;
            top: -50vh;
            left: -20vw;
            width: 120vw;
            /* Huge spread */
            height: 150vh;
            background: radial-gradient(circle, #1792cf 0%, transparent 70%);
            opacity: 0.9;
        }

        /* 2. Cyan/Teal Drift (Middle Transition) */
        .blob-2 {
            position: absolute;
            top: 20vh;
            left: 60vw;
            /* Centered around the 100vw mark (the fold) */
            width: 80vw;
            height: 100vh;
            background: radial-gradient(circle, #7fd3db 0%, transparent 60%);
            opacity: 0.8;
            mix-blend-mode: overlay;
        }

        /* 3. Golden Glow (Bottom Right - End) */
        .blob-3 {
            position: absolute;
            bottom: -50vh;
            right: -20vw;
            /* Far right of the 200vw canvas */
            width: 140vw;
            height: 150vh;
            background: radial-gradient(circle, #e8c94a 0%, transparent 70%);
            opacity: 0.9;
        }

        /* 4. Highlight mixing blob */
        .blob-4 {
            position: absolute;
            top: 10vh;
            left: 120vw;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, #ded16b 0%, transparent 70%);
            opacity: 0.6;
        }

        /* Noise Texture overlay */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            /* Small tile size */
            opacity: 0.25;
            /* Subtle grain */
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 2;
        }

        /* Content sits on top */
        .content-layer {
            position: relative;
            z-index: 3;
            display: flex;
            width: 100%;
            height: 100%;
        }

        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 2rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            text-align: center;
            opacity: 0.9;
        }

        .scroll-hint {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<body>
    <div class="scroll-hint">← Scroll to Drift →</div>

    <div class="scroll-container">
        <!-- The Continuous Background Canvas -->
        <div class="atmospheric-background">
            <div class="blob-1"></div> <!-- Blue Start -->
            <div class="blob-2"></div> <!-- Cyan Bridge -->
            <div class="blob-3"></div> <!-- Yellow End -->
            <div class="blob-4"></div> <!-- Gold Highlight -->
            <div class="noise-overlay"></div>
        </div>

        <!-- The Content -->
        <div class="content-layer">
            <div class="section">
                <h1>Deep Blue</h1>
                <p>Starting in the cold, atmospheric blue tones extracted from the top-left of the image.</p>
            </div>
            <div class="section">
                <h1>Golden Warmth</h1>
                <p>Drifting seamlessly into the warm, granular yellow tones from the bottom-right.</p>
            </div>
        </div>
    </div>
</body>

</html>
