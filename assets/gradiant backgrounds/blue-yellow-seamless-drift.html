<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Drift - Diagonal Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100vh;
            background: #fff;
        }

        /* 
           EXTRACTED PALETTE (from methodology file):
           Start Blue: #87CEEB
           Mid Blue: #6BB6E0
           Bridge Blue: #A8D8F0
           Bridge Cream: #FFE8C8
           End Yellow: #FFD700
           End Orange: #FFD84D
        */

        .scroll-container {
            width: 200vw;
            height: 100vh;
            position: relative;
            display: flex;
        }

        /* Continuous Canvas Background */
        .atmospheric-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Base color is the bridge cream to ensure warmth in the middle */
            background-color: #FFE8C8;
            overflow: hidden;
        }

        /* 
           Diagonal Drift Blobs 
           Positioned to mimic the "Diagonal" feel but with soft radial falloff
        */

        /* 1. The Starting Sky Blue (Top Left) */
        .blob-1 {
            position: absolute;
            top: -40vh;
            left: -20vw;
            width: 100vw;
            height: 140vh;
            background: radial-gradient(circle, #87CEEB 0%, transparent 70%);
            opacity: 0.9;
        }

        /* 2. Deeper Blue Diagonal Streak (Bottom Left -> Center) */
        .blob-2 {
            position: absolute;
            bottom: -30vh;
            left: 0vw;
            width: 90vw;
            height: 120vh;
            background: radial-gradient(circle, #6BB6E0 0%, transparent 60%);
            opacity: 0.8;
            mix-blend-mode: multiply;
            /* Adds depth */
        }

        /* 3. The Bridge / Meeting Point (Center) */
        /* Takes the bridge colors (Pale Blue + Cream) and mixes them softy */
        .blob-3 {
            position: absolute;
            top: 10vh;
            left: 80vw;
            /* Spanning the middle fold */
            width: 60vw;
            height: 80vh;
            background: radial-gradient(circle, #A8D8F0 0%, transparent 70%);
            opacity: 0.6;
        }

        /* 4. The Golden Sun (Top Right / End Section) */
        .blob-4 {
            position: absolute;
            top: -20vh;
            left: 140vw;
            width: 80vw;
            height: 100vh;
            background: radial-gradient(circle, #FFD700 0%, transparent 60%);
            opacity: 0.9;
        }

        /* 5. Deep Orange Warmth (Bottom Right) */
        .blob-5 {
            position: absolute;
            bottom: -40vh;
            right: -10vw;
            width: 110vw;
            height: 120vh;
            background: radial-gradient(circle, #FFD84D 0%, transparent 70%);
            opacity: 0.85;
        }

        /* Noise Texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            opacity: 0.35;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 2;
        }

        /* Content Layer */
        .content-layer {
            position: relative;
            z-index: 3;
            display: flex;
            width: 100%;
            height: 100%;
        }

        .section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            color: #333;
            /* Dark text for contrast against light background */
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #1a1a1a;
            letter-spacing: -2px;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.5;
            color: #4a4a4a;
        }

        .scroll-hint {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.4);
            color: #333;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="scroll-hint">← Scroll: Blue Sky → Golden Sunset →</div>

    <div class="scroll-container">
        <!-- Continuous Seamless Background -->
        <div class="atmospheric-background">
            <div class="blob-1"></div>
            <div class="blob-2"></div>
            <div class="blob-3"></div>
            <div class="blob-4"></div>
            <div class="blob-5"></div>
            <div class="noise-overlay"></div>
        </div>

        <!-- Content -->
        <div class="content-layer">
            <div class="section">
                <h1>Sky Blue</h1>
                <p>Starting with the cool tones from your original palette (#87CEEB).</p>
            </div>
            <div class="section">
                <h1>Golden Hour</h1>
                <p>Drifting seamlessly into the warm yellows and oranges (#FFD700).</p>
            </div>
        </div>
    </div>
</body>

</html>
