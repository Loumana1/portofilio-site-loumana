<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trap Machine - Loumana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<style>.back-site{position:fixed;top:12px;left:12px;z-index:9999;padding:.55rem .9rem;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:500 13px/1 system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)}.back-site:hover{background:rgba(0,0,0,.75)}</style>
<a class="back-site" href="/technology.html#games">← Technology</a>

    <!-- Floating Header / Controls -->
    <header class="floating-header">
        <h1 class="app-title">TRAP MACHINE</h1>

        <div class="header-controls">
            <button class="play-pause-btn" id="sequencerPlayPause">
                <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
                </svg>
            </button>
            <div class="bpm-control">
                <label>BPM</label>
                <input type="number" class="bpm-input" id="bpmInput" value="140" min="60" max="200">
            </div>
            <button class="clear-btn" id="sequencerClear">CLEAR</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="sequencer-container">
        <!-- Pattern Selector -->
        <!-- Pattern Selector Only -->
        <div class="pattern-selector-group">
            <div class="pattern-selector">
                <label class="selector-label">PATTERN</label>
                <select id="pattern-select" class="pattern-dropdown">
                    <!-- Populated by JS -->
                </select>
            </div>

            <div class="pattern-controls">
                <button class="control-btn" id="shuffleDrums">SHUFFLE</button>
                <button class="control-btn" id="prevPattern">PREV</button>
                <button class="control-btn" id="nextPattern">NEXT</button>
            </div>
        </div>

        <!-- Interactive Drum Machine Title (Machine Switcher) -->
        <div class="drum-machine-info" id="machineTrigger">
            <div class="machine-title-wrapper">
                <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 10l5 5 5-5z" />
                </svg>
                <span id="currentMachineName">BNYX DEATH OBLIVION DRUM MACHINE</span>
            </div>
            <!-- Custom Dropdown Menu (Hidden by default) -->
            <div class="machine-menu" id="machineMenu">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Track Edit Popover (Hidden by default) -->
        <div class="track-edit-popover" id="trackEditPopover">
            <h3 class="popover-title">EDIT SOUND</h3>

            <div class="edit-control-group">
                <label>SAMPLE</label>
                <select id="popoverSampleSelect" class="popover-dropdown">
                    <!-- Dynamic -->
                </select>
            </div>

            <div class="edit-control-group">
                <label>VOLUME</label>
                <input type="range" id="popoverVolume" min="0" max="1" step="0.05" class="popover-slider">
            </div>

            <button class="close-popover-btn" id="closePopover">CLOSE</button>
        </div>

        <!-- Drum Tracks -->
        <div class="drum-tracks" id="drumTracks">
            <!-- Tracks will be generated by JavaScript -->
        </div>

        <!-- Add Drum Track -->
        <div class="add-track-section">
            <label>ADD TRACK</label>
            <div class="add-track-wrapper">
                <select class="add-track-dropdown" id="addTrackDropdown">
                    <option value="kick">Kick</option>
                    <option value="snare">Snare</option>
                    <option value="hihat">Hi-Hat</option>
                    <option value="clap">Clap</option>
                    <option value="808">808</option>
                    <option value="perc">Perc</option>
                    <option value="rim">Rim</option>
                </select>
                <button class="add-track-btn" id="addTrackBtn">+</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
